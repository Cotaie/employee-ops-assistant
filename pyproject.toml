[project]
name = "employee-ops-assistant-dev"
version = "0.1.0"
description = "Root development environment for the Employee Ops Assistant monorepo."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "mypy>=1.17.0,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
clients = { workspace = true }
contracts = { workspace = true }

[tool.uv.workspace]
members = [
      "services/agent_api",
      "services/embeddings_api",
      "services/ingestion_api",
      "services/gradio_ui",
      "services/retrieve_api",
      "libs/clients",
      "libs/contracts",
]
