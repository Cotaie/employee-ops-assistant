[project]
name = "embeddings-api"
version = "0.1.0"
description = "EmbeddingsApi service for Employee Ops Assistant."
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "fastapi>=0.115.0,<1.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "sentence-transformers>=5.1.0,<6.0.0",
    "torch>=2.2.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "mypy>=1.17.0,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src"]
packages = ["embeddings_api"]
