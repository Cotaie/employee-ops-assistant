[project]
name = "agent-api"
version = "0.1.0"
description = "AgentApi service for Employee Ops Assistant."
requires-python = ">=3.12"
dependencies = [
    "atlassian-python-api>=4.0.7",
    "contracts",
    "fastapi>=0.115.0,<1.0.0",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.2",
    "langchain-ollama>=1.0.0,<2.0.0",
    "langchain-openai>=1.4.1",
    "langgraph>=1.1.0,<2.0.0",
    "langgraph-checkpoint-redis>=0.5.1,<0.6.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "pygithub>=2.9.1",
    "pyjwt[crypto]>=2.10.0,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "mypy>=1.17.0,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src"]
packages = ["agent_api"]
