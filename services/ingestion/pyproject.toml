[project]
name = "ingestion"
version = "0.1.0"
description = "Document ingestion Lambda for Employee Ops Assistant."
requires-python = ">=3.12"
dependencies = [
    "clients",
    "contracts",
    "boto3>=1.40,<2",
    "docx2txt>=0.8,<1.0",
    "langchain-community>=0.3.0,<1.0.0",
    "markdown>=3.7,<4.0.0",
    "pypdf>=5.0.0,<6.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "unstructured>=0.16.0,<1.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17.0,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[tool.uv.sources]
clients = { path = "../../libs/clients" }
contracts = { path = "../../libs/contracts" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src"]
packages = ["ingestion"]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
