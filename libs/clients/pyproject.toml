[project]
name = "clients"
version = "0.1.0"
description = "Shared API clients for Employee Ops Assistant services."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40,<2",
    "chromadb>=0.5.23,<1.0.0",
    "contracts",
]

[tool.setuptools.package-data]
clients = ["py.typed"]

[dependency-groups]
dev = [
    "mypy>=1.17.0,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src"]
packages = ["clients"]
