services:
  redis:
    image: redis:8.2.8-alpine
    container_name: employee-ops-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  chroma:
    image: chromadb/chroma:0.6.3
    container_name: employee-ops-chroma
    restart: unless-stopped
    volumes:
      - chroma-data:/chroma/chroma

  ollama:
    image: ollama/ollama:latest
    container_name: employee-ops-ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ollama-data:/root/.ollama

  ollama-models:
    image: ollama/ollama:latest
    container_name: employee-ops-ollama-models
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ollama pull nomic-embed-text:v1.5
        ollama pull qwen3.5:9b

  embeddings-api:
    build:
      context: ..
      dockerfile: services/embeddings_api/Dockerfile
    container_name: employee-ops-embeddings-api
    restart: unless-stopped
    depends_on:
      chroma:
        condition: service_started
      ollama-models:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: embeddings-api
      SERVICE_VERSION: docker
      MODEL_NAME: nomic-embed-text:v1.5
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_TIMEOUT_SECONDS: "300"
      PYTHONPATH: /app/libs/contracts/src:/app/services/embeddings_api/src

  ingestion-api:
    build:
      context: ..
      dockerfile: services/ingestion_api/Dockerfile
    container_name: employee-ops-ingestion-api
    restart: unless-stopped
    depends_on:
      - chroma
      - embeddings-api
    environment:
      SERVICE_NAME: ingestion-api
      SERVICE_VERSION: docker
      EMBEDDINGS_API_URL: http://embeddings-api:8000
      EMBEDDINGS_API_TIMEOUT_SECONDS: "300"
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      CHROMA_COLLECTION_NAME: ingested_documents_v2

  retrieve-api:
    build:
      context: ..
      dockerfile: services/retrieve_api/Dockerfile
    container_name: employee-ops-retrieve-api
    restart: unless-stopped
    depends_on:
      - chroma
      - embeddings-api
    environment:
      SERVICE_NAME: retrieve-api
      SERVICE_VERSION: docker
      EMBEDDINGS_API_URL: http://embeddings-api:8000
      EMBEDDINGS_API_TIMEOUT_SECONDS: "300"
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      CHROMA_COLLECTION_NAME: ingested_documents_v2

  agent-api:
    build:
      context: ..
      dockerfile: services/agent_api/Dockerfile
    container_name: employee-ops-agent-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      retrieve-api:
        condition: service_started
      ollama-models:
        condition: service_completed_successfully
    env_file:
      - ../services/agent_api/.env
    environment:
      SERVICE_NAME: agent-api
      SERVICE_VERSION: docker
      LLM_MODEL: ollama:qwen3.5:9b
      OLLAMA_BASE_URL: http://ollama:11434
      REDIS_URL: redis://redis:6379
      CHECKPOINT_TTL_MINUTES: "1440"
      RETRIEVE_API_URL: http://retrieve-api:8000
      RETRIEVE_API_TIMEOUT_SECONDS: "300"

  gradio-ui:
    build:
      context: ..
      dockerfile: services/gradio_ui/Dockerfile
    container_name: employee-ops-gradio-ui
    restart: unless-stopped
    depends_on:
      - agent-api
    environment:
      AGENT_API_URL: http://agent-api:8000
      AGENT_API_TIMEOUT_SECONDS: "300"
    expose:
      - "7860"

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    container_name: employee-ops-oauth2-proxy
    restart: unless-stopped
    depends_on:
      - gradio-ui
    env_file:
      - ./oauth2-proxy/.env
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://gradio-ui:7860/
      OAUTH2_PROXY_SCOPE: openid email profile
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_REFRESH: 50m
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_TRUSTED_PROXY_IPS: 172.16.0.0/12
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    expose:
      - "4180"

  caddy:
    image: caddy:2.11.4-alpine
    container_name: employee-ops-caddy
    restart: unless-stopped
    depends_on:
      - oauth2-proxy
    environment:
      APP_ADDRESS: ${APP_ADDRESS:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-config:
  caddy-data:
  chroma-data:
  ollama-data:
  redis-data:
