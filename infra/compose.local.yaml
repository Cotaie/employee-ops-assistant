services:
  embeddings:
    build:
      context: ..
      dockerfile: services/embeddings/Dockerfile
    container_name: employee-ops-embeddings
    restart: unless-stopped
    entrypoint: ["/aws-lambda/aws-lambda-rie", "/lambda-entrypoint.sh"]
    command: ["embeddings.lambda_handler.handler"]
    ports:
      - "127.0.0.1:9000:8080"
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-employee-ops}
      BEDROCK_REGION: ${BEDROCK_REGION:-eu-central-1}
      BEDROCK_DIMENSIONS: ${BEDROCK_DIMENSIONS:-1024}
      BEDROCK_MAX_CONCURRENCY: ${BEDROCK_MAX_CONCURRENCY:-4}
      MODEL_NAME: ${MODEL_NAME:-amazon.titan-embed-text-v2:0}
    volumes:
      - ${HOME}/.aws:/root/.aws
      - ${HOME}/.aws-lambda-rie:/aws-lambda:ro

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  chroma:
    ports:
      - "127.0.0.1:8002:8000"

  ingestion-api:
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      EMBEDDINGS_LAMBDA_FUNCTION_NAME: function
      EMBEDDINGS_LAMBDA_REGION: eu-central-1
      EMBEDDINGS_LAMBDA_ENDPOINT_URL: http://embeddings:8080
      AWS_ACCESS_KEY_ID: local-rie
      AWS_SECRET_ACCESS_KEY: local-rie
      AWS_DEFAULT_REGION: eu-central-1
      CHROMA_COLLECTION_NAME: ${CHROMA_COLLECTION_NAME:-ingested_documents_titan_v2}
    depends_on:
      - embeddings
      - chroma
    volumes:
      - ../data/documents:/data/documents:ro

  retrieve-api:
    ports:
      - "127.0.0.1:8004:8000"
    environment:
      EMBEDDINGS_LAMBDA_FUNCTION_NAME: function
      EMBEDDINGS_LAMBDA_REGION: eu-central-1
      EMBEDDINGS_LAMBDA_ENDPOINT_URL: http://embeddings:8080
      AWS_ACCESS_KEY_ID: local-rie
      AWS_SECRET_ACCESS_KEY: local-rie
      AWS_DEFAULT_REGION: eu-central-1
      CHROMA_COLLECTION_NAME: ${CHROMA_COLLECTION_NAME:-ingested_documents_titan_v2}
    depends_on:
      - embeddings
      - chroma

  agent-api:
    ports:
      - "127.0.0.1:8003:8000"
