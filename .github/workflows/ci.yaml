name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: Python validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Validate Python workspace
        run: bash scripts/check-workspace.sh

  cdk:
    name: CDK validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json
          node-version: "22"

      - name: Install CDK dependencies
        run: npm ci

      - name: Type-check CDK
        run: npm run build

      - name: Synthesize CloudFormation
        run: npm run synth -- --quiet

  docker:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: agent-api
            dockerfile: services/agent_api/Dockerfile
          - image: embeddings-api
            dockerfile: services/embeddings/Dockerfile
          - image: gradio-ui
            dockerfile: services/gradio_ui/Dockerfile
          - image: ingestion-api
            dockerfile: services/ingestion_api/Dockerfile
          - image: retrieve-api
            dockerfile: services/retrieve_api/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: >-
          docker build
          --file "${{ matrix.dockerfile }}"
          --tag "employee-ops/${{ matrix.image }}:${{ github.sha }}"
          .
